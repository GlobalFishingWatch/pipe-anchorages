name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Install flake8
        run: pip --disable-pip-version-check install flake8

      - name: Lint with flake8
        run: flake8 --count

  tests:
    name: tests - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        # 3.13 is covered by tests-in-docker (same version the Dockerfile builds on);
        # no need to run it twice.
        python-version: ["3.14"]
    env:
      VENV: .venv
      PACKAGE: pipe_anchorages

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: make uv

      - name: Create virtual environment
        # make uv pins .python-version to 3.13; --python makes the venv use the matrix version.
        run: uv venv --python ${{ matrix.python-version }} $VENV

      - name: Cache uv
        # The packages are installed with uv, which keeps its own cache, not pip's.
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-test.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install GDAL
        # Fiona has no wheel for Python 3.14, so it is built from source against GDAL.
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev

      - name: Install package with test dependencies
        run: |
          . $VENV/bin/activate
          make install-test
          pip install .

      - name: Cache Prism
        # The tests run Beam on Prism, a binary Beam downloads from GitHub on first use.
        uses: actions/cache@v4
        with:
          path: ~/.apache_beam/cache/prism
          key: prism-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}

      - name: Test with pytest
        run: |
          . $VENV/bin/activate
          pytest --cov=$PACKAGE --cov-report=xml

      - name: Upload coverage reports to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  tests-in-docker:
    name: tests - Python 3.13 on Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        # Only the test image is built, and its layers are cached between runs: a push that
        # does not touch the requirements reuses the layers of the dependencies.
        uses: docker/bake-action@v6
        with:
          # bake-action builds from the Git context by default, which ignores the .dockerignore.
          source: .
          files: docker-compose.yaml
          targets: test
          load: true
          set: |
            *.cache-from=type=gha,scope=test-image
            *.cache-to=type=gha,scope=test-image,mode=max

      - name: Run tests
        run: make docker-test
